<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — 1699</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="images/BTfpU.jpg" alt="1699 Logo">
        1699
      </a>
      <button class="menu-toggle" aria-label="Menu">☰</button>
      <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="heritage.html">Heritage</a>
        <a href="about.html">About</a>
        <a href="size-guide.html">Size Guide</a>
        <a href="contact.html">Contact</a>
      </nav>
      <a href="cart.html" class="cart-btn">Cart <span class="cart-count">0</span></a>
    </div>
  </header>

  <section class="section">
    <div class="section-inner" style="max-width:600px;">
      <h1 class="section-title">Checkout</h1>
      <div class="gold-line"></div>
      <p style="text-align:center;margin-bottom:2rem;">Demo checkout. No real payment is processed.</p>
      <form id="checkout-form" onsubmit="event.preventDefault(); placeOrder();">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" required>
        </div>
        <div class="form-group">
          <label>Shipping Address</label>
          <textarea required placeholder="Street, City, State, ZIP"></textarea>
        </div>
        <div class="form-group">
          <label>Card Number (demo)</label>
          <input type="text" placeholder="4242 4242 4242 4242" required>
        </div>
        <button type="submit" class="btn" style="width:100%;">Place Order</button>
      </form>
      <p style="text-align:center;margin-top:1.5rem;"><a href="cart.html">← Back to Cart</a></p>
    </div>
  </section>

  <footer>
    <div class="footer-inner">
      <div><h4>1699</h4></div>
      <div><a href="shop.html">Shop</a></div>
      <div><a href="heritage.html">Heritage</a></div>
      <div><a href="contact.html">Contact</a></div>
    </div>
    <div class="footer-bottom">© 2026 1699 Streetwear</div>
  </footer>
  <script src="js/app.js"></script>
</body>
</html>
