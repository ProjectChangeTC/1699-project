<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — 1699</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="images/BTfpU.jpg" alt="1699 Logo">
        1699
      </a>
      <button class="menu-toggle" aria-label="Menu">☰</button>
      <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="heritage.html">Heritage</a>
        <a href="about.html">About</a>
        <a href="size-guide.html">Size Guide</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
      <a href="cart.html" class="cart-btn">Cart <span class="cart-count">0</span></a>
    </div>
  </header>

  <section class="section">
    <div class="section-inner" style="max-width:600px;">
      <h1 class="section-title">Contact</h1>
      <div class="gold-line"></div>
      <p style="text-align:center;margin-bottom:2rem;">Questions about a design, sizing, or wholesale? Reach out. We reply with respect and clarity.</p>
      <form onsubmit="event.preventDefault(); alert('Message sent (demo). We’ll be in touch.'); this.reset();">
        <div class="form-group">
          <label>Name</label>
          <input type="text" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" required>
        </div>
        <div class="form-group">
          <label>Subject</label>
          <select>
            <option>General Inquiry</option>
            <option>Order / Sizing</option>
            <option>Heritage Question</option>
            <option>Wholesale / Collaboration</option>
          </select>
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea required></textarea>
        </div>
        <button type="submit" class="btn" style="width:100%;">Send Message</button>
      </form>
      <p style="text-align:center;margin-top:2rem;color:var(--gray);">hello@1699.street · Traverse City roots, worldwide diaspora</p>
    </div>
  </section>

  <footer>
    <div class="footer-inner">
      <div><h4>1699</h4></div>
      <div><a href="shop.html">Shop</a></div>
      <div><a href="heritage.html">Heritage</a></div>
      <div><a href="about.html">About</a></div>
    </div>
    <div class="footer-bottom">© 2026 1699 Streetwear</div>
  </footer>
  <script src="js/app.js"></script>
</body>
</html>
